name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create application.properties
        run: |
          cat <<EOF > drivemate/src/main/resources/application.properties
          (기존과 동일)
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x drivemate/gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build
          build-root-directory: drivemate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drivemate-Server
          path: drivemate/build/libs/*.jar

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: drivemate/build/reports/tests/test/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Drivemate-Server
          path: springboot

      - name: Deploy to EC2 with Docker
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |
          echo "$EC2_SSH_KEY" > x10.pem
          chmod 600 x10.pem

          # jar => springboot/app.jar 로 이동
          mv springboot/*.jar springboot/app.jar

          # EC2에 Dockerfile 포함 전체 프로젝트 전송
          scp -i x10.pem -o StrictHostKeyChecking=no -r springboot $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/

          # Docker build & up
          ssh -i x10.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'EOF'
            cd /home/$EC2_USERNAME/Deploy
            docker-compose build spring
            docker-compose up -d spring
          EOF

          rm -f x10.pem
