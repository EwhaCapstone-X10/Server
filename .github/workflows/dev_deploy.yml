name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create application.properties
        run: |
          mkdir -p drivemate/src/main/resources
          cat <<EOF > drivemate/src/main/resources/application.properties
          spring.application.name=drivemate
          server.address=0.0.0.0

          spring.datasource.url=${{ secrets.RDS_URL }}
          spring.datasource.username=${{ secrets.RDS_USERNAME }}
          spring.datasource.password=${{ secrets.RDS_PASSWORD }}
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

          openai.api.key=${{ secrets.AI_KEY }}
          openai.api.url=https://api.openai.com/v1/chat/completions

          spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          spring.jpa.properties.hibernate.format_sql=true

          spring.security.oauth2.client.registration.kakao.client-id=${{ secrets.OAUTH_REST }}
          spring.security.oauth2.client.registration.kakao.client-secret=${{ secrets.OAUTH_CLIENT }}
          spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/oauth/callback/kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_img, profile_nickname

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          jwt.secretKey=${{ secrets.JWT_KEY }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x drivemate/gradlew

      - name: Build with Gradle (skip tests)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test
          build-root-directory: drivemate

      - name: Move JAR to springboot directory
        run: |
          mkdir -p springboot
          JAR_PATH=$(find drivemate/build/libs -name "*.jar" ! -name "*plain.jar" | head -n 1)
          cp "$JAR_PATH" springboot/app.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code again
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > x10.pem
          chmod 600 x10.pem

      - name: Create .env file
        run: |
          cat <<EOF > .env
          JWT_KEY=${{ secrets.JWT_KEY }}
          RDS_URL=${{ secrets.RDS_URL }}
          RDS_USERNAME=${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}
          OAUTH_REST=${{ secrets.OAUTH_REST }}
          OAUTH_CLIENT=${{ secrets.OAUTH_CLIENT }}
          KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          AI_KEY=${{ secrets.AI_KEY }}
          EOF

      - name: Show .env to confirm (debug)
        run: cat .env

      - name: Zip necessary files
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -r code.zip springboot ai_model docker-compose.yml .env -x '*.git*'

      - name: Send code.zip to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          scp -i x10.pem -o StrictHostKeyChecking=no code.zip $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/

      - name: Deploy on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i x10.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'EOF'
            sudo apt-get update && sudo apt-get install -y unzip docker-compose

            mkdir -p ~/Deploy
            unzip -o ~/code.zip -d ~/Deploy
            rm ~/code.zip

            cd ~/Deploy
            echo "✅ .env 내용 확인:"
            cat .env

            docker-compose down
            docker system prune -af
            docker-compose up --build -d
          EOF

      - name: Cleanup SSH key
        run: rm -f x10.pem
